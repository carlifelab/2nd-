
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="車の購入から売却までの実質コストを無料で計算できるツールです。">
<title>車の実質コスト計算機</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f4f6f8;color:#202b3c;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif}
header{background:#172b4d;color:white;padding:28px 20px;text-align:center}
header h1{font-size:23px;margin:0 0 9px}
header p{font-size:13px;color:#d5deed;margin:0}
main{max-width:620px;margin:22px auto;padding:0 15px}
.card{background:white;border-radius:14px;padding:20px;margin-bottom:15px;box-shadow:0 2px 12px #0000000a}
h2{font-size:17px;margin:0 0 18px}
label{display:block;font-size:13px;font-weight:600;margin:14px 0 6px}
input{width:100%;padding:13px;border:1px solid #d7dce3;border-radius:8px;font-size:16px;background:#fff}
.unit{font-size:11px;color:#778195;font-weight:400}
button{width:100%;padding:16px;border:0;border-radius:9px;background:#1768d1;color:white;font-size:17px;font-weight:bold;margin-top:18px}
.result{background:#172b4d;color:white}
.result h2{color:white}
.big{font-size:34px;font-weight:800;margin:8px 0}
.result p{color:#d5deed;font-size:13px}
.line{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid #ffffff30;font-size:14px}
.line strong{text-align:right}
.note{font-size:12px;color:#778195;line-height:1.7}
footer{text-align:center;color:#87909e;font-size:11px;padding:20px}
</style>
</head>
<body>
<header>
<h1>車の実質コスト計算機</h1>
<p>車にかかる本当の費用を見える化</p>
</header>

<main>
<div class="card">
<h2>① 車両の購入・売却</h2>
<label>購入価格（円）</label>
<input id="buy" type="number" value="2500000" min="0">
<label>売却予想価格（円）</label>
<input id="sell" type="number" value="1500000" min="0">
<label>保有予定年数</label>
<input id="years" type="number" value="5" min="1" max="50">
</div>

<div class="card">
<h2>② 維持費</h2>
<label>年間走行距離（km）</label>
<input id="distance" type="number" value="10000" min="0">
<label>年間の税金・保険料（円）</label>
<input id="insurance" type="number" value="100000" min="0">
<label>年間の車検・整備費用（円）</label>
<input id="maintenance" type="number" value="100000" min="0">
<label>実燃費（km/L）</label>
<input id="efficiency" type="number" value="12" min="0.1" step="0.1">
<label>ガソリン単価（円/L）</label>
<input id="fuel" type="number" value="175" min="0">
<label>月極駐車場代（円/月）</label>
<input id="parking" type="number" value="10000" min="0">
<button onclick="calculate()">実質コストを計算する</button>
</div>

<div class="card result" id="result" aria-live="polite">
<h2>③ あなたの車の実質コスト</h2>
<p>月々の実質負担額（概算）</p>
<div class="big" id="monthly">---</div>
<div class="line"><span>保有期間中の総コスト</span><strong id="total">---</strong></div>
<div class="line"><span>車両の値下がり分（月額）</span><strong id="depreciation">---</strong></div>
<div class="line"><span>1kmあたりのコスト</span><strong id="perkm">---</strong></div>
<p>※ローン金利、購入諸費用、修理の臨時出費などは含まない概算です。</p>
</div>

<div class="card">
<h2>この計算について</h2>
<p class="note">
購入価格と売却予想価格の差額に、税金・保険・整備・燃料・駐車場などの維持費を加えて計算します。実際の費用は車種、使用状況、保険内容などによって変わります。入力内容は外部に送信しません。
</p>
</div>
</main>

<footer>車の実質コスト計算機 | 無料・登録不要</footer>

<script>
function yen(n){
 return Math.round(n).toLocaleString("ja-JP")+"円";
}
function val(id){
 return Number(document.getElementById(id).value);
}
function calculate(){
 const buy=val("buy");
 const sell=val("sell");
 const years=val("years");
 const distance=val("distance");
 const insurance=val("insurance");
 const maintenance=val("maintenance");
 const efficiency=val("efficiency");
 const fuel=val("fuel");
 const parking=val("parking");

 if(years<=0 || efficiency<=0 || distance<0 ||
 buy<0 || sell<0 || insurance<0 ||
 maintenance<0 || fuel<0 || parking<0){
  alert("入力内容を確認してください。");
  return;
 }

 const months=years*12;
 const depreciation=Math.max(0,buy-sell);
 const annualFuel=distance/efficiency*fuel;
 const monthlyCost=
  depreciation/months+
  (insurance+maintenance+annualFuel)/12+
  parking;
 const totalCost=
  depreciation+
  (insurance+maintenance+annualFuel)*years+
  parking*months;
 const perKm=distance>0?monthlyCost/(distance/12):0;

 document.getElementById("monthly").textContent=yen(monthlyCost)+"/月";
 document.getElementById("total").textContent=yen(totalCost);
 document.getElementById("depreciation").textContent=yen(depreciation/months);
 document.getElementById("perkm").textContent=
  distance>0?perKm.toFixed(1)+"円/km":"走行距離を入力してください";
 document.getElementById("result").scrollIntoView({behavior:"smooth"});
}
calculate();
</script>
</body>
</html>
